server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    # Static Frontend SPA
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Controller Traffic Telemetry APIs & Live SSE Stream
    location /api/v1/traffic/summary {
        proxy_pass http://controller:8000/api/v1/traffic/summary;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/v1/traffic/timeseries {
        proxy_pass http://controller:8000/api/v1/traffic/timeseries;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/v1/traffic/regions {
        proxy_pass http://controller:8000/api/v1/traffic/regions;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/v1/traffic/recent-events {
        proxy_pass http://controller:8000/api/v1/traffic/recent-events;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/v1/traffic/events {
        proxy_pass http://controller:8000/api/v1/traffic/events;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/v1/traffic/stream {
        proxy_pass http://controller:8000/api/v1/traffic/stream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
    }

    # Real-time Gateway Traffic Streaming (SSE) and Management
    location /api/v1/traffic/ {
        proxy_pass http://gateway:8080/api/v1/traffic/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
    }

    location /api/traffic/ {
        proxy_pass http://gateway:8080/api/traffic/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
    }

    # Public Read-Only Dashboard Telemetry & Authenticated Admin Control Plane
    location /api/v1/ {
        proxy_pass http://controller:8000/api/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Admin-Secret $http_x_admin_secret;
        proxy_set_header X-Internal-Secret $http_x_internal_secret;
        proxy_set_header Authorization $http_authorization;
    }

    # Administrative Chaos & Telemetry Simulation Endpoints:
    # Strictly blocks unauthenticated public callers lacking an administrative credential.
    location /internal/ {
        if ($http_x_admin_secret = "") {
            return 403 '{"detail": "Forbidden: Administrative operations require valid X-Admin-Secret header."}\n';
        }
        proxy_pass http://controller:8000/internal/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Admin-Secret $http_x_admin_secret;
        proxy_set_header X-Internal-Secret $http_x_admin_secret;
        proxy_set_header Authorization $http_authorization;
    }

    # Public Health Probes
    location /health/ {
        proxy_pass http://controller:8000/health/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Interactive OpenAPI / Swagger Documentation (Restricted in production without admin authentication)
    location ~ ^/(docs|openapi\.json|redoc) {
        if ($http_x_admin_secret = "") {
            return 403 '{"detail": "Forbidden: API documentation restricted in production. Provide valid X-Admin-Secret."}\n';
        }
        proxy_pass http://controller:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Public Client Application Data via Dynamic Ingress Gateway
    location /api/records {
        proxy_pass http://gateway:8080/api/records;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/data/ {
        proxy_pass http://gateway:8080/api/data/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/ecommerce/ {
        proxy_pass http://gateway:8080/api/ecommerce/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/shop/ {
        proxy_pass http://gateway:8080/api/shop/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
