server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    # Static Frontend SPA
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Public Read-Only Dashboard Telemetry & Authenticated Admin Control Plane
    location /api/v1/ {
        proxy_pass http://controller:8000/api/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Admin-Secret $http_x_admin_secret;
        proxy_set_header X-Internal-Secret $http_x_internal_secret;
        proxy_set_header Authorization $http_authorization;
    }

    # Administrative Chaos & Telemetry Simulation Endpoints:
    # Strictly blocks unauthenticated public callers lacking an administrative credential.
    location /internal/ {
        if ($http_x_admin_secret = "") {
            return 403 '{"detail": "Forbidden: Administrative operations require valid X-Admin-Secret header."}\n';
        }
        proxy_pass http://controller:8000/internal/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Admin-Secret $http_x_admin_secret;
        proxy_set_header X-Internal-Secret $http_x_admin_secret;
        proxy_set_header Authorization $http_authorization;
    }

    # Public Health Probes
    location /health/ {
        proxy_pass http://controller:8000/health/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Interactive OpenAPI / Swagger Documentation
    location /docs {
        proxy_pass http://controller:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /openapi.json {
        proxy_pass http://controller:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /redoc {
        proxy_pass http://controller:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Public Client Application Data via Dynamic Ingress Gateway
    location /api/records {
        proxy_pass http://gateway:8080/api/records;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/data/ {
        proxy_pass http://gateway:8080/api/data/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
