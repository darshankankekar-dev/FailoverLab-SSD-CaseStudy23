server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    # Static Frontend SPA
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # =========================================================================
    # 1. Controller Traffic Telemetry APIs & Controller SSE Stream (Port 8000)
    # =========================================================================

    location = /api/v1/traffic/summary {
        proxy_pass http://controller:8000/api/v1/traffic/summary;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /api/v1/traffic/timeseries {
        proxy_pass http://controller:8000/api/v1/traffic/timeseries;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /api/v1/traffic/regions {
        proxy_pass http://controller:8000/api/v1/traffic/regions;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /api/v1/traffic/recent-events {
        proxy_pass http://controller:8000/api/v1/traffic/recent-events;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Controller Live SSE Stream
    location = /api/v1/traffic/stream {
        proxy_pass http://controller:8000/api/v1/traffic/stream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Cache-Control "no-cache";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        chunked_transfer_encoding off;
    }

    # =========================================================================
    # 2. Gateway Traffic APIs & Gateway SSE Stream (Port 8080)
    # =========================================================================

    # Existing Gateway Live Event Stream (Must remain separate on Gateway!)
    location = /api/v1/traffic/events {
        proxy_pass http://gateway:8080/api/v1/traffic/events;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Cache-Control "no-cache";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        chunked_transfer_encoding off;
    }

    # Gateway Traffic Management & Streaming
    location /api/v1/traffic/ {
        proxy_pass http://gateway:8080/api/v1/traffic/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
    }

    location /api/traffic/ {
        proxy_pass http://gateway:8080/api/traffic/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
    }

    # =========================================================================
    # 3. Controller General APIs & Admin Operations (Port 8000)
    # =========================================================================

    location /api/v1/ {
        proxy_pass http://controller:8000/api/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Admin-Secret $http_x_admin_secret;
        proxy_set_header Authorization $http_authorization;
    }

    # Block internal telemetry ingestion from public reverse proxy access
    location /internal/telemetry/ {
        return 403 '{"detail": "Forbidden: Internal telemetry endpoints are private to the Docker service network."}\n';
    }

    # Administrative Chaos Simulation Endpoints (Requires valid admin secret if enforced)
    location /internal/ {
        proxy_pass http://controller:8000/internal/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Admin-Secret $http_x_admin_secret;
        proxy_set_header Authorization $http_authorization;
    }

    # Public Health Probes
    location /health/ {
        proxy_pass http://controller:8000/health/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Interactive OpenAPI / Swagger Documentation
    location ~ ^/(docs|openapi\.json|redoc) {
        proxy_pass http://controller:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # =========================================================================
    # 4. Gateway Client & Application APIs (Port 8080)
    # =========================================================================

    location /api/records {
        proxy_pass http://gateway:8080/api/records;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/data/ {
        proxy_pass http://gateway:8080/api/data/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/ecommerce/ {
        proxy_pass http://gateway:8080/api/ecommerce/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/shop/ {
        proxy_pass http://gateway:8080/api/shop/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
